openapi: 3.0.3
info:
  title: Mentor Backend API
  version: 1.0.0
  description: |
    OpenAPI specification for the Mentor backend. This backend serves as the **read-focused**
    interface for the monitoring dashboard, providing data retrieval and command creation.

    ## Role Separation
    - **Mentor Backend (this API)**: Read-focused - retrieves device data for dashboards and creates commands for devices
    - **Devices Backend**: Write-focused - receives telemetry data from devices and provides command polling

    ## Features
    - Device listing and status monitoring (read)
    - Metrics retrieval (read)
    - Alert viewing (read)
    - Remote command creation (write)
    - Screenshot retrieval with presigned URLs (read)
    - Activity log access (read)
    - Process information (read)
    - Command history and pending commands (read)

    ## Base URL
    Local: `http://localhost:30090`
    Production: `https://dashboard-api.raqeem.example.com`

    ## Authentication
    Currently no authentication required (MVP). For production deployment,
    implement JWT bearer tokens or API key authentication.

    ## CORS
    Configured via FRONTEND_ORIGIN environment variable. Set to your
    dashboard URL (e.g., `http://localhost:5001`).

    ## Docs
    - GitHub: https://github.com/mj-nehme/raqeem
    - Full documentation: /docs in repository
  contact:
    name: Raqeem Team
    url: https://github.com/mj-nehme/raqeem
servers:
  - url: "{scheme}://{host}:{port}"
    variables:
      scheme:
        default: http
        enum:
          - http
          - https
      host:
        default: localhost
      port:
        default: "PORT"
        description: "Set this to your mentor backend port (e.g., from .env: MENTOR_BACKEND_PORT)"

# Authentication (Future)
# Currently, no authentication is required for MVP release.
# For production, consider implementing:
# - JWT Bearer tokens for user authentication
# - API keys for device-to-backend communication
# - Rate limiting per API key or IP address
#
# security:
#   - ApiKeyAuth: []
#   - BearerAuth: []

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns service health status. Used by Kubernetes liveness and readiness probes.
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  service:
                    type: string
                    example: "mentor-backend"
              example:
                status: "ok"
                service: "mentor-backend"
        "503":
          description: Service unavailable

  /devices:
    get:
      summary: List registered devices
      description: Get a list of all registered devices with their current status.
      responses:
        "200":
          description: Array of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"

  /devices/{id}/metrics:
    get:
      summary: Get metrics for a device (most recent points)
      description: Retrieve recent performance metrics for a specific device.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 60
      responses:
        "200":
          description: List of metric points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceMetric"

  /devices/{id}/processes:
    get:
      summary: Get process list for a device
      description: Retrieve the latest known process list for a specific device.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: List of processes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Process"

  /devices/{id}/activities:
    get:
      summary: Get activities for a device
      description: Retrieve recent activity logs for a specific device.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: List of activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLog"

  /devices/{id}/alerts:
    get:
      summary: Get alerts for a device
      description: Retrieve recent alerts for a specific device.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /devices/{id}/screenshots:
    get:
      summary: Get screenshots for a device
      description: Retrieve recent screenshot metadata with presigned URLs for a specific device.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of screenshot metadata with presigned URLs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Screenshot"

  /screenshots/{filename}:
    get:
      summary: Stream screenshot file
      description: Stream a screenshot image directly from storage.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Screenshot image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: Screenshot not found

  /devices/commands:
    post:
      summary: Queue a remote command for a device
      description: Create a new remote command to be executed on a specific device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteCommandCreate"
      responses:
        "200":
          description: Command queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteCommand"

  /devices/{id}/commands/pending:
    get:
      summary: Get pending remote commands for a device
      description: Retrieve all pending commands waiting for execution on a device.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of pending commands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemoteCommand"

  /devices/{id}/commands:
    get:
      summary: Get command history for a device
      description: Retrieve command execution history for a specific device.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: List of commands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemoteCommand"

  /activities:
    get:
      summary: List recent activities
      description: Get a list of activities across all devices.
      responses:
        "200":
          description: Activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLog"

components:
  schemas:
    Device:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        os:
          type: string
        last_seen:
          type: string
          format: date-time
        is_online:
          type: boolean
        location:
          type: string
        ip_address:
          type: string
        mac_address:
          type: string
        current_user:
          type: string

    DeviceMetric:
      type: object
      properties:
        id:
          type: integer
        device_id:
          type: string
        timestamp:
          type: string
          format: date-time
        cpu_usage:
          type: number
          format: float
        cpu_temp:
          type: number
        memory_total:
          type: integer
        memory_used:
          type: integer
        swap_used:
          type: integer
        disk_total:
          type: integer
        disk_used:
          type: integer
        net_bytes_in:
          type: integer
        net_bytes_out:
          type: integer

    Process:
      type: object
      properties:
        id:
          type: integer
        device_id:
          type: string
        pid:
          type: integer
        name:
          type: string
        cpu:
          type: number
        memory:
          type: integer
        command:
          type: string
        timestamp:
          type: string
          format: date-time

    ActivityLog:
      type: object
      properties:
        id:
          type: integer
        device_id:
          type: string
        timestamp:
          type: string
          format: date-time
        type:
          type: string
        description:
          type: string
        app:
          type: string
        duration:
          type: integer

    RemoteCommandCreate:
      type: object
      required: [device_id, command]
      properties:
        device_id:
          type: string
        command:
          type: string

    RemoteCommand:
      type: object
      properties:
        id:
          type: integer
        device_id:
          type: string
        command:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        result:
          type: string
        exit_code:
          type: integer

    Alert:
      type: object
      properties:
        id:
          type: integer
        device_id:
          type: string
        timestamp:
          type: string
          format: date-time
        level:
          type: string
        type:
          type: string
        message:
          type: string
        value:
          type: number
        threshold:
          type: number

    Screenshot:
      type: object
      properties:
        screenshotid:
          type: string
        deviceid:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        resolution:
          type: string
        size:
          type: integer
        screenshot_url:
          type: string
