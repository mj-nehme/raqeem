services:
  postgres:
    # Using explicit registry reference for official PostgreSQL image
    image: docker.io/library/postgres:14
    environment:
      POSTGRES_DB: monitoring_db
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitorpw
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Using Quay.io registry for MinIO (official MinIO registry)
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  devices-backend:
    build:
      context: ../devices/backend
      dockerfile: Dockerfile
    environment:
      PORT: "8081"
      # Use asyncpg driver per app validation
      DATABASE_URL: "postgresql+asyncpg://monitor:monitorpw@postgres:5432/monitoring_db"
      SECRET_KEY: "ci-secret-key"
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      BUCKET_ENDPOINT: "minio:9000"
      BUCKET_ACCESS_KEY: "minioadmin"
      BUCKET_SECRET_KEY: "minioadmin"
      BUCKET_DIR: "screenshots"
      BUCKET_SECURE: "false"
      MENTOR_API_URL: "http://mentor-backend:8080"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; import sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8081/health', timeout=2).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mentor-backend:
    build:
      context: ../mentor/backend
      dockerfile: Dockerfile
    environment:
      # Align with app's expected env var names (POSTGRES_*)
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "monitor"
      POSTGRES_PASSWORD: "monitorpw"
      POSTGRES_DB: "monitoring_db"
      # Explicitly set PORT to match container exposure
      PORT: "8080"
      BUCKET_ENDPOINT: "minio:9000"
      BUCKET_ACCESS_KEY: "minioadmin"
      BUCKET_SECRET_KEY: "minioadmin"
      BUCKET_DIR: "screenshots"
      BUCKET_USE_SSL: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
