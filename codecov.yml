codecov:
  require_ci_to_pass: false # Allow codecov to work even if other CI checks fail
  notify:
    wait_for_ci: false

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 90%
        threshold: 5%
        if_ci_failed: error
        informational: false
    patch:
      default:
        target: 90%
        threshold: 5%
        informational: false

flags:
  mentor-backend:
    paths:
      - mentor/backend/src/
    carryforward: true
  devices-backend:
    paths:
      - devices/backend/src/
    carryforward: true
  dashboard:
    paths:
      - mentor/dashboard/src/
    carryforward: true
  devices-web-simulator:
    paths:
      - devices/web-simulator/src/
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
