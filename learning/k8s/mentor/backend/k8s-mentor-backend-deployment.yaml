apiVersion: apps/v1
kind: Deployment
metadata:
  name: mentor-backend
  labels:
    app: mentor-backend
    platform: raqeem
spec:
  selector:
    matchLabels:
      app: mentor-backend
      platform: raqeem
  template:
    metadata:
      labels:
        app: mentor-backend
        platform: raqeem
    spec:
      containers:
        - name: mentor-backend-container
          image: ghcr.io/mj-nehme/raqeem-mentor-backend:latest
          ports:
            - containerPort: 30090
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
